<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券条款生成器</title>
<style>
  :root{
    --ink:#1c2024;
    --ink-soft:#5a6472;
    --line:#e2e5e9;
    --line-soft:#edeff2;
    --bg:#f7f8fa;
    --panel:#ffffff;
    --accent:#1e5f74;
    --accent-soft:#e7f0f2;
    --warn-bg:#fdf3e7;
    --warn-ink:#8a5a1f;
    --warn-line:#f0ddba;
    --mono:"SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px;}
  header.page{margin-bottom:22px;}
  header.page h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.2px;}
  header.page p{margin:0;color:var(--ink-soft);font-size:13px;}

  .layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;}
  @media (max-width: 920px){ .layout{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 18px 20px;
  }
  .card + .card{margin-top:16px;}
  .card h2{font-size:13px;font-weight:600;margin:0 0 14px;color:var(--ink);}
  .card h2 .hint{font-weight:400;color:var(--ink-soft);margin-left:6px;font-size:12px;}

  .field{margin-bottom:13px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field label .req{color:#c0432f;margin-left:2px;}
  .match-hint{font-size:11.5px;margin-top:5px;color:var(--accent);min-height:0;}
  .match-hint.warn{color:#a35b1f;}
  .match-hint:empty{display:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    font-size:13.5px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}

  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .seg button{
    flex:1;background:#fff;border:none;padding:8px 6px;font-size:13px;color:var(--ink-soft);
    cursor:pointer;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--accent);color:#fff;}

  .checkline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);}
  .checkline input{width:auto;}

  .discount-block{display:none;}
  .discount-block.active{display:block;}

  .out-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .out-head h1{font-size:17px;margin:0;}
  .out-sub{color:var(--ink-soft);font-size:12.5px;}

  .banner{
    background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);
    border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;display:none;
  }
  .banner.show{display:block;}

  .block{border:1px solid var(--line-soft);border-radius:8px;margin-bottom:12px;overflow:hidden;}
  .block-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 13px;background:#fafbfc;border-bottom:1px solid var(--line-soft);
  }
  .block-head .tag{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.3px;}
  .block-head .tag small{color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .copy-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--accent);}
  .copy-btn.copied{background:var(--accent);color:#fff;border-color:var(--accent);}
  .block-body{padding:12px 13px;font-size:13px;white-space:pre-wrap;word-break:break-word;}
  .block-body.empty{color:#b7bec6;font-style:normal;}

  .snippet-group{display:grid;gap:10px;margin-bottom:10px;}
  .snippet-group:last-child{margin-bottom:0;}
  .snippet-group .block{margin-bottom:0;}
  @media (max-width:640px){.snippet-group{grid-template-columns:1fr !important;}}

  .lang-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .lang-tabs button{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;
  }
  .lang-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .lang-tabs button[disabled]{opacity:.35;cursor:not-allowed;}

  .empty-state{color:var(--ink-soft);font-size:13px;padding:30px 10px;text-align:center;}
  footer.foot{margin-top:28px;color:#9aa3ab;font-size:11.5px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>优惠券条款生成器</h1>
    <p>填写左侧必填字段，右侧自动生成活动名称、各语言条款与文案片段 — 逐条对照原表公式实现</p>
  </header>

  <div class="layout">
    <!-- ============ LEFT: INPUTS ============ -->
    <div class="inputs">
      <div class="card">
        <h2>必填信息</h2>

        <div class="field">
          <label>币种 Curr.<span class="req">*</span></label>
          <select id="in-curr"></select>
        </div>

        <div class="field">
          <label>产品类型<span class="req">*</span></label>
          <select id="in-product">
            <option value="F">机票 Flight</option>
            <option value="H" selected>酒店 Hotel</option>
            <option value="X">套餐 Bundle&amp;Save</option>
            <option value="T">中国火车票 China Train</option>
            <option value="E">国际火车票 International Train</option>
            <option value="P">门票/体验 Attractions &amp; Tours</option>
            <option value="CRU">邮轮 Cruise</option>
            <option value="TOR">旅行团 Packaged Tours</option>
            <option value="C">租车 Car Rental</option>
            <option value="A">机场接送 Airport Transfer</option>
          </select>
        </div>

        <div class="row2">
          <div class="field">
            <label>开始日期<span class="req">*</span></label>
            <input type="date" id="in-start">
          </div>
          <div class="field">
            <label>结束日期<span class="req">*</span></label>
            <input type="date" id="in-end">
          </div>
        </div>

        <div class="field">
          <label>码类型<span class="req">*</span></label>
          <div class="seg" id="in-type">
            <button data-v="Public" class="active">公开码 Public</button>
            <button data-v="Private">领取码 Private</button>
          </div>
        </div>

        <div class="field">
          <label>折扣方式<span class="req">*</span></label>
          <div class="seg" id="in-discmode">
            <button data-v="fixed" class="active">固定金额</button>
            <button data-v="pct">百分比封顶</button>
          </div>
        </div>

        <div class="discount-block active" id="block-fixed">
          <div class="row2">
            <div class="field">
              <label>立减金额 Discount$<span class="req">*</span></label>
              <input type="number" id="in-discamt" placeholder="例如 50" value="50">
            </div>
            <div class="field">
              <label>最低消费 Minspend$</label>
              <input type="number" id="in-minspend1" placeholder="留空=无门槛" value="500">
            </div>
          </div>
        </div>

        <div class="discount-block" id="block-pct">
          <div class="row2">
            <div class="field">
              <label>折扣百分比 %<span class="req">*</span></label>
              <input type="number" id="in-discpct" placeholder="例如 10 表示10%">
            </div>
            <div class="field">
              <label>封顶金额 Cap$<span class="req">*</span></label>
              <input type="number" id="in-cap" placeholder="例如 200">
            </div>
          </div>
          <div class="field">
            <label>最低消费 Minspend$</label>
            <input type="number" id="in-minspend2" placeholder="留空=无门槛">
          </div>
        </div>

        <div class="field">
          <label>每人可用次数 Usage<span class="req">*</span></label>
          <input type="number" id="in-usage" value="1" min="1">
        </div>
      </div>

      <div class="card">
        <h2>命名信息 <span class="hint">只用于拼优惠券内部识别名，不影响条款正文</span></h2>

        <div class="row2">
          <div class="field">
            <label>成本中心 Cost Center</label>
            <input type="text" id="in-costcenter" placeholder="例如 OA / 1840" value="OA">
          </div>
          <div class="field">
            <label>活动代号 Project</label>
            <input type="text" id="in-project" placeholder="例如 DBS BAU" value="DBS BAU">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>可选信息 <span class="hint">不填则按默认处理</span></h2>

        <div class="field">
          <label>适用范围 sku <span class="hint">对应 F/H/P 表第一列代码，随产品类型切换列表</span></label>
          <select id="in-sku"></select>
          <div class="match-hint" id="sku-match-hint"></div>
        </div>

        <div class="field">
          <label>限定支付卡组织 payment</label>
          <select id="in-payment"></select>
          <div class="match-hint" id="payment-match-hint"></div>
        </div>

        <div class="field">
          <label>时段标签 Tag <span class="hint">对应条款第1条展示的放码时间点</span></label>
          <select id="in-tag">
            <option value="">不指定具体时间点</option>
          </select>
          <div class="match-hint" id="tag-match-hint">注：活动跨度满 90 天或以上时，第1条按原表设计不展示具体时间点（即使这里选了时间，也不会出现）</div>
        </div>

        <div class="field">
          <label>适用平台</label>
          <div class="seg" id="in-device">
            <button data-v="app" class="active">仅限 App</button>
            <button data-v="all">网页+App 全平台</button>
          </div>
        </div>

        <div class="field">
          <label>出行/入住截止日期</label>
          <input type="date" id="in-traveldate">
        </div>

        <div class="field">
          <label>初始名额数量 <span class="hint">(用于港/台条款第1条)</span></label>
          <input type="number" id="in-qty" placeholder="例如 100">
        </div>

        <div class="field">
          <label class="checkline"><input type="checkbox" id="in-newonly"> 仅限新用户 (New Sign Up)</label>
        </div>
      </div>
    </div>

    <!-- ============ RIGHT: OUTPUT ============ -->
    <div class="outputs">
      <div class="banner" id="pct-caveat-banner">
        该币种在原表模板里从未出现过"百分比折扣"的真实案例，第3条措辞已用封顶金额替代折扣金额展示，建议人工核对后再使用。
      </div>

      <div class="card">
        <h2>条款 <span class="hint" id="lang-availability-hint"></span></h2>
        <div class="lang-tabs" id="lang-tabs"></div>
        <div id="term-blocks"></div>
      </div>

      <div class="card">
        <h2>文案片段 <span class="hint">用于拼装落地页/banner等素材</span></h2>
        <div id="snippet-area" style="margin-top:12px;"></div>
      </div>
    </div>
  </div>

  <footer class="foot">所有生成逻辑均基于原 Sheet1 表格公式逐条翻译并用 227 条真实历史数据核对一致</footer>
</div>

    const p = dateParts(d);
    const mn = monthName(d, lang);
    const y = p.y + (yearOffset || 0);
    return `${p.day} ${mn} ${y}`;
  }

  // ---- number formatting helpers ----
  // raw-amount grouping (no pre-division), separator configurable. Used for EN/ID sentence-level IDR amounts.
  function groupRaw(n, sep) {
    const r = Math.round(n);
    if (r < 1000) return String(r);
    if (r < 1e6) return Math.floor(r / 1000) + sep + pad3(r % 1000);
    return Math.floor(r / 1e6) + sep + pad3(Math.floor((r % 1e6) / 1000)) + sep + pad3(r % 1000);
  }
  // pre-divided-by-1000 grouping (assumes amount is a multiple of 1000), used for VND everywhere
  // and for EN/local "mechanism" short-form IDR display.
  function groupPreDivided(n, sep) {
    const k = Math.round(n / 1000);
    if (k < 1000) return k + sep + '000';
    if (k >= 10000) return Math.round(n / 1e6) + sep + '000' + sep + '000';
    const s = String(k);
    return s[0] + sep + s.slice(1, 4) + sep + '000';
  }

  function pctInt(x) { return Math.trunc(x * 100); }
  // Chinese "折" tier display: e.g. 0.25 -> "75折"; 0.3 -> "7折"
  function zheDisplay(x) {
    const p = pctInt(x);
    const lastDigit = String(p).slice(-1);
    if (lastDigit === '0') return String((100 - p) / 10);
    return String(100 - p);
  }

  // ---- lookups ----
  function currencySymbol(ccy) { const r = CURR[ccy]; return r ? r.symbol : ccy; }
  function countryName(ccy) { const r = CURR[ccy]; return r ? r.country : ''; }
  function prodDescEN(h) { const r = PRODTYPE[h]; return r ? r.en : ''; }
  function prodDescZH(h) { const r = PRODTYPE[h]; return r ? r.zh : ''; }

  function timeNormEN(tag) {
    if (!tag) return '';
    const row = TIMES[String(tag).toLowerCase()];
    return row ? row.en : '';
  }
  function timeNormZH(tag) {
    if (!tag) return '';
    const row = TIMES[String(tag).toLowerCase()];
    return row ? row.zh : '';
  }

  function payLookup(code) {
    if (!code) return null;
    return PAY[String(code).toLowerCase()] || null;
  }

  const SKU_TABLE = { F: DATA.F, H: DATA.H, P: DATA.P };
  function skuRow(product, skuCode) {
    const table = SKU_TABLE[product] || DATA.P;
    return table.find(r => String(r.sku).toLowerCase() === String(skuCode).toLowerCase());
  }

  // =========================================================
  // Main generation
  // =========================================================
  function generate(inp) {
    const G = inp.curr;           // currency code e.g. SGD
    const H = inp.product;        // F / H / X
    const I = inp.start;          // Date
    const J = inp.end;            // Date
    const M = inp.type;           // Public / Private
    const P = inp.sku;            // sku code, '' or 'all' etc.
    const Q = inp.usage;          // number
    const R = inp.payment || '';  // payment code
    const S = inp.device || '';   // 'all' or ''
    const T = inp.newUserOnly ? 'T' : ''; // New
    const U = inp.traveldate || null;     // Date or null
    const V = inp.discountAmt;    // Discount$
    const W = inp.minSpend;       // Minspend$
    const X = inp.discountPct;    // Discount% (fraction) or null
    const Y = inp.cap;            // Cap$
    const L = inp.tag || '';      // time-of-day tag

    const sym = currencySymbol(G);
    const country = countryName(G);
    const prodH = (H === 'F') ? 'flights' : (H === 'H' ? 'hotels' : 'products');
    const prodZH = prodDescZH(H);
    const prodEN = prodDescEN(H);

    const hasPct = (X !== null && X !== undefined && X !== '');
    const hasMin = (W !== null && W !== undefined && W !== '');

    // ---------------- 优惠券名称(内部识别代码/Column1) ----------------
    function buildSlug() {
      if (!G) return '';
      const K = inp.costCenter || '';
      const C = inp.project || '';
      const ccyPrefix = String(G).slice(0, 2).toLowerCase();
      const ccPart = String(K).replace(/External/g, 'ext').toLowerCase();
      const prodCode = (H === 'F') ? 'flt' : (H === 'H') ? 'htl' : (H === 'P') ? 'tnt' : (H === 'X') ? 'bs' : String(H).toLowerCase();
      let amt;
      if (!hasPct) amt = (G === 'IDR' || G === 'VND') ? Math.round(V / 1000) : V;
      else amt = (G === 'IDR' || G === 'VND') ? Math.round(Y / 1000) : Y;
      const mmdd = (d) => pad2(d.getMonth() + 1) + pad2(d.getDate());
      const datePart = mmdd(I) + '/' + mmdd(J);
      const projPart = String(C).toLowerCase().replace(/ /g, '');
      const tagPart = L ? ('_' + String(L).toLowerCase().split(' ')[0]) : '';
      return `${ccyPrefix}_${ccPart}_${prodCode}${amt}_${datePart}_${projPart}${tagPart}`;
    }
    const slug = buildSlug();

    // ---------------- date / time building blocks ----------------
    const startEN = dMonthY(I, 'en');
    const endEN = dMonthY(J, 'en');
    const timeEN = timeNormEN(L);
    const timeZH = timeNormZH(L);

    function startAllFor(ccy) {
      if (ccy === 'SGD' || ccy === 'HKD' || ccy === 'TWD' || ccy === 'JPY') return ymdCN(I);
      if (ccy === 'MYR') return dMonthY(I, 'my');
      if (ccy === 'IDR') return dMonthY(I, 'id');
      if (ccy === 'THB') return dMonthY(I, 'th', 543);
      if (ccy === 'VND') return ddmmyyyy(I);
      if (ccy === 'KRW') return ymdKR(I);
      return ymdDash(I);
    }
    function endAllFor(ccy) {
      if (ccy === 'SGD' || ccy === 'HKD' || ccy === 'TWD' || ccy === 'JPY') return ymdCN(J);
      if (ccy === 'MYR') return dMonthY(J, 'my');
      if (ccy === 'IDR') return dMonthY(J, 'id');
      if (ccy === 'THB') return dMonthY(J, 'th', 543);
      if (ccy === 'VND') return ddmmyyyy(J);
      if (ccy === 'KRW') return ymdKR(J);
      return ymdDash(J);
    }
    const startall = startAllFor(G);
    const endall = endAllFor(G);
    const startzhmy = (G === 'MYR') ? ymdCN(I) : '';
    const endzhmy = (G === 'MYR') ? ymdCN(J) : '';

    // td (travel date deadline) building blocks
    function tdEN() {
      if (!U) return '';
      const prefix = (H === 'H') ? ' (check out before ' : ' (travel period till ';
      return prefix + dMonthY(U, 'en') + ')';
    }
    function tdAllFor(ccy) {
      if (!U) return '';
      if (ccy === 'SGD') return (H === 'H' ? ' (退房日期至: ' : ' (旅行日期至: ') + ymdCN(U) + ')';
      if (ccy === 'MYR') return (H === 'H' ? ' (tarikh check out sebelum ' : ' (tarikh penerbangan sebelum ') + dMonthY(U, 'my') + ')';
      if (ccy === 'IDR') return (H === 'H' ? ' (check out sebelum ' : ' (tanggal keberangkatan sebelum ') + dMonthY(U, 'id') + ')';
      if (ccy === 'THB') return (H === 'H' ? ' ระยะเวลาเข้าพัก: จนถึง ' : ' ระยะเวลาเดินทาง: จนถึง ') + dMonthY(U, 'th', 543);
      if (ccy === 'VND') return (H === 'H' ? ' (Thời gian lưu trú: ' : ' (Thời gian bay: đến hết ') + ddmmyyyy(U) + ')';
      if (ccy === 'HKD') return (H === 'H' ? '（住宿入住日期至：' : '（旅遊日期至：') + ymdCN(U) + '）';
      if (ccy === 'TWD') return (H === 'H' ? '（住宿入住日期至：' : '（旅遊日期至：') + ymdCN(U) + ' 23:59 GMT+8）';
      if (ccy === 'JPY') return '（クーポン適用の旅行期間' + ymdCN(U) + ' 23:59 まで）';
      return '';
    }
    const tdEN_ = tdEN();
    const tdall = tdAllFor(G);
    const tdzhmy = (G === 'MYR' && U) ? ((H === 'H' ? ' (退房日期至: ' : ' (旅行日期至: ') + ymdCN(U) + ')') : '';

    // pay building blocks
    const payRow = payLookup(R);
    const payEN = R ? (payRow ? payRow.en : '') : '';
    function payAllFor(ccy) {
      if (!R) return '';
      if (!payRow) return '';
      const col = { SGD: 'zh', MYR: 'my', HKD: 'hk', TWD: 'tw', THB: 'th', VND: 'vn', JPY: 'jp', KRW: 'kr', IDR: 'id' }[ccy];
      const v = col ? payRow[col] : null;
      return (v === null || v === undefined || v === '') ? payEN : v;
    }
    const payall = payAllFor(G);
    const payzhmy = (G === 'MYR') ? ((payRow && payRow.zh) ? payRow.zh : payEN) : '';

    // playidname
    const playidname = `${M} ${H} ${pad2(I.getMonth() + 1)}-${pad2(I.getDate())} ${L}`;

    // ---------------- sku building blocks ----------------
    function skuLookup(product, langCol, fallbackCol) {
      const row = skuRow(product, P);
      if (!row) return null;
      let v = row[langCol];
      if (v === null || v === undefined || v === '') v = row[fallbackCol];
      return v;
    }
    const skuEN = (() => {
      const row = skuRow(H === 'X' ? 'P' : H, P);
      let v = row ? row.en : P;
      if (v === undefined) v = P;
      if (v && v.indexOf('your country') !== -1) v = v.replace(/your country/g, country);
      return v || '';
    })();
    const skuColMap = { SGD: 'cn', IDR: 'id', MYR: 'my', THB: 'th', VND: 'vn', HKD: 'hk', TWD: 'tw', JPY: 'jp' };
    function skuAllRaw() {
      const prod = (H === 'X') ? 'P' : H;
      const row = skuRow(prod, P);
      const col = skuColMap[G];
      let v = row ? (col ? row[col] : null) : null;
      if (v === null || v === undefined || v === '') v = row ? row.en : skuEN;
      if (v === undefined || v === null) v = skuEN;
      return v || '';
    }
    const skuAllRawVal = skuAllRaw();
    const skuall = String(skuAllRawVal).replace(/本国/g, '新加坡');
    // skuzhmy 专门走 F/H/P 表的 "cn"(中文) 列，服务马来西亚华人读者；fallback 到 en 列
    function skuZhmyRaw() {
      const prod = (H === 'X') ? 'P' : H;
      const row = skuRow(prod, P);
      let v = row ? row.cn : null;
      if (v === null || v === undefined || v === '') v = row ? row.en : skuEN;
      if (v === undefined || v === null) v = skuEN;
      return v || '';
    }
    const skuzhmy = (G === 'MYR') ? String(skuZhmyRaw()).replace(/本国/g, '马来西亚') : '';

    // ---------------- mechanism (机制) ----------------
    function fmtAmtEN(n) { return (G === 'IDR') ? groupRaw(n, ',') : n; }
    function mechEN() {
      if (!hasPct) {
        if (!hasMin) return `${prodEN} bookings ${sym}${fmtAmtEN(V)} OFF`;
        return `${sym}${fmtAmtEN(V)} OFF (min. spend ${sym}${fmtAmtEN(W)})`;
      } else {
        if (!hasMin) return `${pctInt(X)}% OFF (Up to ${sym}${fmtAmtEN(Y)})`;
        return `Up to ${sym}${fmtAmtEN(Y)} OFF (min. spend ${sym}${fmtAmtEN(W)})`;
      }
    }
    function mechAll() {
      if (G === 'SGD') {
        if (!hasPct) {
          if (!hasMin) return `${prodZH}立减S$${V}`;
          return `满S$${W}减S$${V}`;
        }
        return (!hasMin ? `${zheDisplay(X)}折优惠 折扣高达S$${Y}` : `${zheDisplay(X)}折优惠 折扣高达S$${Y} 最低消费S$${W}`);
      }
      if (G === 'MYR') {
        if (!hasPct) return `Diskaun RM${V} (perbelanjaan minimum RM${W})`;
        if (!hasMin) return `Diskaun ${pctInt(X)}% (hingga RM${Y})`;
        return `Diskaun hingga RM${Y} (perbelanjaan minimum RM${W})`;
      }
      if (G === 'IDR') {
        if (!hasPct) return `Diskon Rp${groupRaw(V, '.')} (min. transaksi Rp${groupRaw(W, '.')})`;
        if (!hasMin) return `Diskon ${pctInt(X)}% (s.d Rp${groupRaw(Y, '.')})`;
        return `Diskon s.d Rp${groupRaw(Y, '.')} (min. transaksi Rp${groupRaw(W, '.')})`;
      }
      if (G === 'THB') {
        const label = (H === 'F') ? 'ส่วนลดเที่ยวบิน' : (H === 'H' ? 'ส่วนลดโรงแรม' : 'ส่วนลด');
        if (!hasPct) return `${label} ฿${V} (ขั้นต่ำ ฿${W})`;
        if (!hasMin) return `${label} ${pctInt(X)}% (สูงสุด ฿${Y})`;
        return `${label} ฿${Y} (ขั้นต่ำ ฿${W})`;
      }
      if (G === 'VND') {
        if (!hasPct) return `Giảm ${groupPreDivided(V, '.')} VND đặt tối thiểu ${groupPreDivided(W, '.')} VND`;
        if (!hasMin) return `Giảm ${pctInt(X)}% tối đa ${Y}`;
        return `Giảm tối đa ${groupPreDivided(Y, '.')} đặt tối thiểu ${groupPreDivided(W, '.')} VND`;
      }
      if (G === 'HKD' || G === 'TWD') {
        const sign = (G === 'HKD') ? 'HK$' : 'NT$';
        const label = (H === 'F') ? '機票' : (H === 'H' ? '住宿' : '');
        if (!hasPct) return `${label}減 ${sign}${V} (最低消費 ${sign}${W})`;
        if (!hasMin) return `${label}${zheDisplay(X)}折 (折扣高達 ${sign}${Y})`;
        return `${label}折扣高達 ${sign}${Y} (最低消費 ${sign}${W})`;
      }
      if (G === 'JPY') {
        const label = (H === 'F') ? '航空券' : (H === 'H' ? 'ホテル' : '');
        if (!hasPct) return `${label}${V}円オフ (最低利用料金：${W}円)`;
        if (!hasMin) return `${label}${pctInt(X)}%オフ (最大${Y}円オフ)`;
        return `${label}${Y}円オフ (最低利用料金：${W}円)`;
      }
      if (G === 'KRW') {
        if (!hasPct) return `${V}원 할인 (최소 결제 금액 : ${W}원)`;
        if (!hasMin) return `${pctInt(X)}% 할인 (최대 ${Y}원 할인)`;
        return `${Y}원 할인 (최소 결제 금액 : ${W}원)`;
      }
      // fallback: 限制EN placeholder (DN2 fallback in original points to 限制EN which is unusual; keep EN mech as fallback)
      return mechEN();
    }
    // 机制(马来西亚中文) —— 原表 nameZHMY 公式里内嵌的机制部分，专供马来西亚华人读者，与 mechAll() 的马来文不同
    function mechZHMY() {
      if (G !== 'MYR') return '';
      if (!hasPct) {
        if (!hasMin) return `${prodZH}立减RM${V}`;
        return `满RM${W}减RM${V}`;
      }
      if (!hasMin) return `${zheDisplay(X)}折优惠 折扣高达RM${Y}`;
      return `${zheDisplay(X)}折优惠 折扣高达RM${Y} 最低消费RM${W}`;
    }

    // ---------------- restriction (限制) ----------------
    function limitEN() {
      let out = '';
      if (payEN) out += payEN + ' ';
      if (T) out += 'new user only ';
      if (skuEN && P !== 'all') out += skuEN + ' ';
      return out.trim() + (out ? ' ' : '');
    }
    function limitAllFor(ccy) {
      if (ccy === 'SGD') {
        let out = '';
        if (payall) out += payall + ' ';
        if (T) out += '限新用户 ';
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'MYR') {
        let out = '';
        if (T) out += 'pengguna baru sahaja ';
        if (payall) out += payall + ' ';
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'IDR') {
        let out = '';
        if (T) out += 'hanya pengguna baru ';
        if (payall) out += payall + ' ';
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'THB') {
        let out = '';
        if (payEN) out += `ชำระด้วยบัตร ${payall} `;
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'VND') {
        let out = '';
        if (payall) out += `và chỉ áp dụng cho ${payall} `;
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'HKD' || ccy === 'TWD') {
        let out = '';
        if (payall) out += `限${payall} `;
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'JPY') {
        let out = '';
        if (payall) out += `${payall}会員様限定 `;
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      if (ccy === 'KRW') {
        let out = '';
        if (payall) out += payall + ' ';
        if (skuall && P !== 'all') out += skuall + ' ';
        return out;
      }
      return limitEN();
    }
    const limitzhmy = (G === 'MYR') ? (() => {
      let out = '';
      if (payzhmy) out += payzhmy + ' ';
      if (T) out += '限新用户 ';
      if (skuzhmy && P !== 'all') out += skuzhmy + ' ';
      return out;
    })() : '';

    const limitEN_ = limitEN();
    const limitAll_ = limitAllFor(G);

    // ---------------- name ----------------
    const mechENv = mechEN();
    const mechAllv = mechAll();
    const mechZHMYv = mechZHMY();
    const nameEN = mechENv + (limitEN_.trim() ? ' ' + limitEN_.trim() + ' ' : '');
    const nameALL = mechAllv + (limitAll_.trim() ? ' ' + limitAll_.trim() + ' ' : '');
    const nameZHMY = (G === 'MYR') ? (mechZHMYv + (limitzhmy.trim() ? ' ' + limitzhmy.trim() : '')) : '';

    // ---------------- T1-T6 per language ----------------
    const dayCount = Math.round((J - I) / 86400000);
    const sameDay = dayCount === 0;
    const under90 = dayCount < 90;

    function periodClauseEN() {
      if (sameDay) return `1. Promotion period: available on ${endEN}${timeEN ? `, release at ${timeEN}` : ''}`;
      if (under90) return `1. Promotion period: available from ${startEN}${timeEN ? `, ${timeEN}` : ''} till end of ${endEN}`;
      return `1. Promotion period: available till end of ${endEN}`;
    }
    const T1 = periodClauseEN() + tdEN_ + (M === 'Private'
      ? '. Promo code has to be claimed on first-come, first-served basis. Upon successfully claim, the promo code will be valid for redemption within the promotion period.'
      : '. Redemptions are first-come-first-served upon payment, while stocks last. Users have to successfully complete the booking to use the code.');

    const T2 = `2. Promotion platform: Trip.com ${S === 'all'
      ? (G === 'USD' ? '' : country + ' ') + 'website, app and mobile site.'
      : (G === 'USD' ? '' : country + '-issued '.replace('-issued ', ' ')) + 'app only. Web browser bookings are not applicable.'}`.replace('website, app and mobile site.', (S === 'all' ? 'website, app and mobile site.' : ''));

    function T2fixed() {
      const countryPrefix = (G === 'USD') ? '' : country + ' ';
      if (S === 'all') return `2. Promotion platform: Trip.com ${countryPrefix}website, app and mobile site.`;
      return `2. Promotion platform: Trip.com ${countryPrefix}app only. Web browser bookings are not applicable.`;
    }

    function amountOFFclauseEN() {
      const minTxt = (G === 'IDR') ? groupRaw(W, ',') : W;
      const vTxt = (G === 'IDR') ? groupRaw(V, ',') : V;
      const yTxt = (G === 'IDR') ? groupRaw(Y, ',') : Y;
      const payIssued = payEN ? ` with ${(G === 'USD') ? '' : country + '-issued '}${payEN}` : '';
      if (!hasPct) {
        const tailNoMin = (H === 'H') ? '. The promo code discount applies only to the room price and does not cover taxes, service charges, or other surcharges.'
          : (H === 'F') ? '. The promo code cannot be applied if the flight ticket fare (inclusive of taxes but does not include miscellaneous expenses such as additional baggage fees or insurance) is lower than the promo code amount.'
          : '.';
        const roomTail = (H === 'H') ? ' (room price after existing platform discounts)' : (H === 'F') ? ' (ticket fare inclusive of taxes but does not include miscellaneous expenses such as additional baggage fees or insurance)' : '';
        if (!hasMin) {
          return `3. ${prodEN} bookings paid in ${G}${payIssued} enjoy ${sym}${vTxt} OFF the purchase amount per booking${tailNoMin}`;
        }
        return `3. ${prodEN} bookings paid in ${G}${payIssued} enjoy ${sym}${vTxt} OFF the purchase amount per booking${roomTail}, min. spend at ${sym}${minTxt}.`;
      } else {
        const roomTail = (H === 'H') ? ' (room price after existing platform discounts)' : (H === 'F') ? ' (ticket fare inclusive of taxes but does not include miscellaneous expenses such as additional baggage fees or insurance)' : '';
        if (!hasMin) {
          return `3. ${prodEN} bookings paid in ${G}${payIssued} enjoy ${pctInt(X)}% OFF the purchase amount per booking${roomTail}, capped at ${sym}${yTxt}.`;
        }
        const capTail = (H === 'F') ? '. The promo code cannot be applied if the purchase amount after discount is lower than the min. spend.' : '.';
        return `3. ${prodEN} bookings paid in ${G}${payIssued} enjoy ${pctInt(X)}% OFF the purchase amount per booking${roomTail}, capped at ${sym}${yTxt}, min. spend at ${sym}${minTxt}${capTail}`;
      }
    }
    const T3 = amountOFFclauseEN();

    function T4For(skuTextEN, skuTextLocal, prodWord) {
      if (!P) return '';
      return `4. Offer applies to ${skuTextEN}. *Please note that promo codes can only be applied to eligible ${prodWord}. To check if the promo code is applicable, enter promo code on the checkout page before final payment to verify.`;
    }
    const T4 = T4For(skuEN, skuall, prodH);

    const T5 = (T ? '5. The promo code is only eligible for New Sign Ups who have not made any bookings on Trip.com website or app. ' : '5. ')
      + 'Users must sign up for a Trip.com account to be able to use the promo code. '
      + (M === 'Private' ? 'Please ensure that the account you are logging into trip.com is the same one that has claimed this promo code so as to successfully use it. ' : '')

    tag.innerHTML = tagText + (subText ? `<small>${subText}</small>` : '');
    head.appendChild(tag);
    head.appendChild(copyBtn(bodyText));
    block.appendChild(head);
    const body = document.createElement('div');
    body.className = 'block-body' + (bodyText ? '' : ' empty');
    if (bodyText){
      body.textContent = asHtmlBr ? bodyText.split('<br>').join('\n') : bodyText;
    } else {
      body.textContent = emptyText || '（当前币种无此语言模板，不生成）';
    }
    block.appendChild(body);
    return block;
  }

  function makeSnippetGroup(cells){
    const row = document.createElement('div');
    row.className = 'snippet-group';
    row.style.gridTemplateColumns = `repeat(${cells.length}, 1fr)`;
    cells.forEach(([label, value])=>{
      row.appendChild(makeBlock(label, '', value, false, '（无）'));
    });
    return row;
  }

  let activeLangTab = 'EN';

  function render(){
    let input, result;
    try {
      input = collectInput();
      if (!input.curr || !input.start || !input.end) { renderEmpty(); return; }
      if (input.discountAmt == null && (input.discountPct == null || input.cap == null)) { renderEmpty(); return; }
      result = engine.generate(input);
    } catch(e){
      renderEmpty('生成失败：' + e.message);
      console.error(e);
      return;
    }

    // caveat banner
    $('pct-caveat-banner').classList.toggle('show', !!result.meta.pctCaveat);

    // lang tabs
    const allLangs = Object.keys(LANG_LABELS);
    const active = result.meta.activeLangs;
    const tabsWrap = $('lang-tabs');
    tabsWrap.innerHTML = '';
    if (!active.includes(activeLangTab)) activeLangTab = 'EN';
    allLangs.forEach(code=>{
      const btn = document.createElement('button');
      btn.textContent = LANG_LABELS[code];
      const isActive = active.includes(code);
      if (!isActive) btn.disabled = true;
      if (code === activeLangTab) btn.classList.add('active');
      btn.addEventListener('click', ()=>{ activeLangTab = code; render(); });
      tabsWrap.appendChild(btn);
    });
    $('lang-availability-hint').textContent = `(当前币种可生成: ${active.map(c=>LANG_LABELS[c]).join('、')})`;

    const termWrap = $('term-blocks');
    termWrap.innerHTML = '';
    termWrap.appendChild(makeBlock(LANG_LABELS[activeLangTab], '', result.terms[activeLangTab], true));

    // snippets
    const s = result.snippets;
    const snippetWrap = $('snippet-area');
    snippetWrap.innerHTML = '';
    const isZhmy = !!result.name.ZHMY;
    // 每组按该字段实际存在的语言变体数(1/2/3)单独成一行，MYR才有3列(EN/本地/马来西亚中文)
    const groups = [
      [['优惠券名称', result.slug], ['PlayID 命名建议', s.playidname]],
      isZhmy
        ? [['标题 (EN)', result.name.EN], ['标题 (本地)', result.name.ALL], ['标题 (马来西亚中文)', result.name.ZHMY]]
        : [['标题 (EN)', result.name.EN], ['标题 (本地)', result.name.ALL]],
      isZhmy
        ? [['机制 (EN)', s.mechEN], ['机制 (本地)', s.mechALL], ['机制 (马来西亚中文)', s.mechZHMY]]
        : [['机制 (EN)', s.mechEN], ['机制 (本地)', s.mechALL]],
      isZhmy
        ? [['限制 (EN)', s.limitEN], ['限制 (本地)', s.limitALL], ['限制 (马来西亚中文)', s.limitZHMY]]
        : [['限制 (EN)', s.limitEN], ['限制 (本地)', s.limitALL]],
      isZhmy
        ? [['适用范围 (EN)', s.skuEN], ['适用范围 (本地)', s.skuALL], ['适用范围 (马来西亚中文)', s.skuZHMY]]
        : [['适用范围 (EN)', s.skuEN], ['适用范围 (本地)', s.skuALL]],
      isZhmy
        ? [['开始日期 (EN)', s.startEN], ['开始日期 (本地)', s.startALL], ['开始日期 (马来西亚中文)', s.startZHMY]]
        : [['开始日期 (EN)', s.startEN], ['开始日期 (本地)', s.startALL]],
      isZhmy
        ? [['结束日期 (EN)', s.endEN], ['结束日期 (本地)', s.endALL], ['结束日期 (马来西亚中文)', s.endZHMY]]
        : [['结束日期 (EN)', s.endEN], ['结束日期 (本地)', s.endALL]],
      [['时段 (EN)', s.timeEN], ['时段 (中文)', s.timeZH]],
      isZhmy
        ? [['出行截止 (EN)', s.tdEN], ['出行截止 (本地)', s.tdALL], ['出行截止 (马来西亚中文)', s.tdZHMY]]
        : [['出行截止 (EN)', s.tdEN], ['出行截止 (本地)', s.tdALL]],
      isZhmy
        ? [['支付方式 (EN)', s.payEN], ['支付方式 (本地)', s.payALL], ['支付方式 (马来西亚中文)', s.payZHMY]]
        : [['支付方式 (EN)', s.payEN], ['支付方式 (本地)', s.payALL]]
    ];
    groups.forEach(cells => snippetWrap.appendChild(makeSnippetGroup(cells)));
  }

  function renderEmpty(msg){
    $('snippet-area').innerHTML = `<div class="empty-state">${msg || '请完整填写左侧必填字段（币种/产品类型/起止日期/折扣信息）'}</div>`;
    $('term-blocks').innerHTML = '';
    $('lang-tabs').innerHTML = '';
    $('lang-availability-hint').textContent = '';
    $('snippet-area').innerHTML = '';
    $('pct-caveat-banner').classList.remove('show');
  }

  render();
})();
</script>
</body>
</html>
